services:
  backend-dev:
    build:
      context: ./backend/dev
      dockerfile: Dockerfile
    container_name: ticket-backend-dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/dev/.env
    networks:
      - multienv-network
    restart: unless-stopped

  backend-prod:
    build:
      context: ./backend/prod
      dockerfile: Dockerfile
    container_name: ticket-backend-prod
    ports:
      - "3002:3002"
    env_file:
      - ./backend/prod/.env
    networks:
      - multienv-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
      - backend-prod
    networks:
      - multienv-network
    restart: unless-stopped

networks:
  multienv-network:
    driver: bridge
